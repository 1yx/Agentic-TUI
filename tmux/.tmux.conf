# tmux configuration
# Prefix: Ctrl+Space
# hjkl directional: h=left, j=down, k=up, l=right
# Session: Ctrl+Alt | Window: Ctrl+Shift | Pane: Alt+Shift

# ─── General ───────────────────────────────────────────────────────

setw -g xterm-keys on
set -s escape-time 0
set -sg repeat-time 300
set -s focus-events on
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -g mouse on
set -sg exit-empty on
set -g detach-on-destroy off
# Cross-platform resolution (macOS Homebrew / Linux) — no hardcoded paths/commands.
# Default shell: resolve fish dynamically (guarded; falls back to $SHELL if absent).
run-shell 'fish=$(command -v fish 2>/dev/null); [ -n "$fish" ] && tmux set -g default-shell "$fish"'
# Clipboard: pick the best available tool (Wayland -> X11 -> macOS); used by the copy-mode binding.
run-shell 'if command -v wl-copy >/dev/null && [ -n "${WAYLAND_DISPLAY:-}" ] && { [ -S "${WAYLAND_DISPLAY:-}" ] || [ -S "${XDG_RUNTIME_DIR:-}/${WAYLAND_DISPLAY:-}" ]; }; then tmux set -g @copy_cmd "wl-copy"; elif command -v xclip >/dev/null; then tmux set -g @copy_cmd "xclip -selection clipboard"; elif command -v pbcopy >/dev/null; then tmux set -g @copy_cmd "pbcopy"; fi'
# OSC52 clipboard (terminal-handled; useful over SSH) — coexists with the copy-pipe binding above.
set -s set-clipboard on
set -g history-limit 10000

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*256col*:RGB"
set -as terminal-overrides ",*256col*:Tc"

# ─── Prefix: Ctrl+Space ───────────────────────────────────────────────────

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# ─── Display ───────────────────────────────────────────────────────

set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 2000
set -g display-time 2000
set -g status-keys emacs
set -g mode-keys emacs

# ─── Session Management (Ctrl+Alt+) ────────────────────────────────

bind -n C-M-c new-session
bind -n C-M-d detach
bind -n C-M-s choose-tree -Z
bind -n C-M-r command-prompt -p "Rename session:" "rename-session '%%'"
bind -n C-M-x kill-session
bind -n C-M-h switch-client -p
bind -n C-M-l switch-client -n

# Switch session by index
bind -n C-M-1 switch-client -t :=1
bind -n C-M-2 switch-client -t :=2
bind -n C-M-3 switch-client -t :=3
bind -n C-M-4 switch-client -t :=4
bind -n C-M-5 switch-client -t :=5
bind -n C-M-6 switch-client -t :=6
bind -n C-M-7 switch-client -t :=7
bind -n C-M-8 switch-client -t :=8
bind -n C-M-9 switch-client -t :=9

# ─── Window Management (Ctrl+Shift+) ──────────────────────────────

bind -n C-S-c new-window -c "#{pane_current_path}"
bind -n C-S-r command-prompt -p "Rename window:" "rename-window '%%'"
bind -n C-S-w kill-window
bind -n C-S-f command-prompt -p "Find window:" "find-window -C '%%'"
bind -n C-S-h previous-window
bind -n C-S-l next-window

# Swap window (h=left, l=right)
bind -n C-S-H run-shell "tmux swap-window -t -1"
bind -n C-S-L run-shell "tmux swap-window -t +1"

# Select window by index
bind -n C-S-1 select-window -t :1
bind -n C-S-2 select-window -t :2
bind -n C-S-3 select-window -t :3
bind -n C-S-4 select-window -t :4
bind -n C-S-5 select-window -t :5
bind -n C-S-6 select-window -t :6
bind -n C-S-7 select-window -t :7
bind -n C-S-8 select-window -t :8
bind -n C-S-9 select-window -t :9

# ─── Pane Management (Alt+Shift+) ─────────────────────────────────

# Navigate (h=left, j=down, k=up, l=right)
bind -n M-H select-pane -L
bind -n M-J select-pane -D
bind -n M-K select-pane -U
bind -n M-L select-pane -R

# Split
bind -n M-V split-window -h -c "#{pane_current_path}"
bind -n M-S split-window -v -c "#{pane_current_path}"

# Actions
bind -n M-W kill-pane
bind -n M-F resize-pane -Z
bind -n M-Z swap-pane
bind -n M-O rotate-window

# Break/join pane
bind -n M-B break-pane
bind -n M-@ choose-tree 'move-pane -h -s "%%"'

# Pane resize (prefix + HJKL, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Copy Mode (emacs) ────────────────────────────────────────────
# 进入：按 M-v（prefix 无关）
# ─ 光标 ─  C-f/→ 右   C-b/← 左   C-n/↓ 下   C-p/↑ 上
# ─ 行内 ─  C-a/Home 行首   C-e/End 行尾   M-m 行首非空白
# ─ 翻页 ─  C-v/PgDn 下翻   M-v/PgUp 上翻   M-< 缓冲顶   M-> 缓冲底
# ─ 词  ─   M-f 下个词尾   M-b 上个词首
# ─ 选择 ─  C-Space 开始选择   R 矩形切换
# ─ 搜索 ─  C-s 增量向下   C-r 增量向上   n 下一个   N 上一个
# ─ 退出 ─  q / Escape / C-c / C-[  (均 cancel)
# 复制键覆盖默认：pipe 到系统剪贴板（跨平台 @copy_cmd = wl-copy|xclip|pbcopy）

bind -n M-v copy-mode

# 复制并退出 → 系统剪贴板（默认不带参数，需覆盖加入 @copy_cmd）
bind -T copy-mode C-w send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind -T copy-mode M-w send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
# 复制到行尾并退出 → 系统剪贴板
bind -T copy-mode C-k send-keys -X copy-pipe-end-of-line-and-cancel "#{@copy_cmd}"

# Paste
bind p paste-buffer
bind b list-buffers

# ─── Theme ─────────────────────────────────────────────────────────

set -g pane-active-border-style fg=#b294bb
set -g pane-border-style fg=colour244

set -g status on
set -g status-justify 'left'
set -g status-interval 1
set -g status-bg black
set -g status-left-length 60
set -g status-right-length 60

set -g status-left '#[fg=magenta,bold] #S #[default]#{?pane_in_mode,#[fg=red bold] COPY · 按 ESC 退出 #[default],}' # copy-mode 时显示红色提示
set -g status-right '#[fg=cyan] %Y-%m-%d %H:%M '

set -g window-status-format '#[fg=#c5c8c6] #I:#W '
set -g window-status-current-format '#[fg=#b294bb,bold] #I:#W '
setw -g window-status-separator ''

# ─── Plugins (TPM) ─────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'lazygit yazi'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
